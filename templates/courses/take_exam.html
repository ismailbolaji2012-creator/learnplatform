
{% extends 'base.html' %}
{% block content %}
<h2>Exam: {{ exam.title }}</h2>
<form method="post">
  {% csrf_token %}
  {% for q in questions %}
    <div>
      <p><strong>{{ forloop.counter }}. {{ q.text }}</strong></p>
      <label><input type="radio" name="{{ q.id }}" value="A"> A. {{ q.option_a }}</label><br>
      <label><input type="radio" name="{{ q.id }}" value="B"> B. {{ q.option_b }}</label><br>
      {% if q.option_c %}<label><input type="radio" name="{{ q.id }}" value="C"> C. {{ q.option_c }}</label><br>{% endif %}
      {% if q.option_d %}<label><input type="radio" name="{{ q.id }}" value="D"> D. {{ q.option_d }}</label><br>{% endif %}
    </div>
  {% endfor %}
  <button type="submit">Submit Exam</button>
</form>
{% endblock %}
