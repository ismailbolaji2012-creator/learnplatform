<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}LearnPlatform{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="light-theme">
  <header class="site-header">
    <div class="wrap">
      <h1><a href="{% url 'courses:index' %}">TechLearn</a></h1>
      <nav>
        <a href="{% url 'courses:index' %}">Home</a> |
        <a href="{% url 'courses:index' %}">Courses</a> |
        <a href="{% url 'about' %}">About</a> |  <!-- Added About link -->
        {% if user.is_authenticated %}
          <a href="{% url 'courses:my_courses' %}">My Courses</a> |
          <span>Hi, {{ user.username }}</span> |
          <a href="{% url 'courses:logout' %}">Logout</a>
        {% else %}
          <a href="{% url 'courses:signup' %}">Sign Up</a> |
          <a href="{% url 'courses:login' %}">Login</a> |
        {% endif %}
        <button id="theme-toggle">🌙</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Contact admin on WhatsApp: <a href="https://wa.me/2348050783205">+2348050783205</a>
    </div>
  </footer>

<script>
const btn = document.getElementById('theme-toggle');
if(btn) btn.addEventListener('click', ()=> document.body.classList.toggle('dark-theme'));
</script>
</body>
</html>
